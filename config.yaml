# One root key per table (key = silver table name).
# ddl_path / sql_transformation are FOLDERS; the file inside is <table>.sql.
#
# bronze_columns / silver_columns : every column of the table with its data type
# ignore_columns      : skipped when comparing the live table with its DDL / column list
# allow_extra_columns : true  -> a column in the live table but not in the DDL is OK
#                       false -> it is reported as a mismatch

pos_transactions:
  schemas:
    bronze_layer:
      ignore_columns:
        - _bronze_run_id
        - _bronze_file
      allow_extra_columns: true    
      ddl_path: kestrel-data-foundation/sqls/bronze_layer/ddls
      sql_transformation: kestrel-data-foundation/sqls/bronze_layer/transformations
      bronze_columns:
        txn_id: VARCHAR
        txn_line_no: SMALLINT
        basket_id: VARCHAR
        outlet_code: VARCHAR
        channel: VARCHAR
        sku_code: VARCHAR
        event_ts: VARCHAR
        qty: INTEGER
        unit_price: DOUBLE
        discount_amount: DOUBLE
        tax_amount: DOUBLE
        payment_mode: VARCHAR
        till_id: SMALLINT
        cashier_id: VARCHAR
        promo_code: VARCHAR
        source_file: VARCHAR
        quantity_units: INTEGER
        uom: VARCHAR
        loyalty_id: VARCHAR
        ingest_date: DATE
        _bronze_run_id: VARCHAR
        _bronze_file: VARCHAR
        _bronze_loaded_at: TIMESTAMP
    silver_layer:
      ignore_columns:
        - _silver_loaded_at
        - _bronze_loaded_at
      allow_extra_columns: true
      ddl_path: kestrel-data-foundation/sqls/silver_layer/ddls
      sql_transformation: kestrel-data-foundation/sqls/silver_layer/transformations
      silver_columns:
        txn_id: VARCHAR
        txn_line_no: SMALLINT
        basket_id: VARCHAR
        outlet_code: VARCHAR
        channel: VARCHAR
        sku_code: VARCHAR
        event_ts_utc: TIMESTAMP
        event_ts_ist: TIMESTAMP
        qty: INTEGER
        uom: VARCHAR
        uom_inferred: BOOLEAN
        eaches_per_case: BIGINT
        conversion_source: VARCHAR
        qty_eaches: BIGINT
        unit_price: DOUBLE
        discount_amount: DOUBLE
        tax_amount: DOUBLE
        line_gross_amount: DOUBLE
        line_net_amount: DOUBLE
        payment_mode: VARCHAR
        till_id: SMALLINT
        cashier_id: VARCHAR
        promo_code: VARCHAR
        loyalty_id: VARCHAR
        source_file: VARCHAR
        ingest_date: DATE
        ingest_lag_days: INTEGER
        _bronze_loaded_at: TIMESTAMP
        _silver_loaded_at: TIMESTAMP
    gold_layer:                      # not validated yet, kept for later
      ignore_columns: []
      allow_extra_columns: true
      ddl_path: kestrel-data-foundation/sqls/gold_layer/ddls
      sql_transformation: kestrel-data-foundation/sqls/gold_layer/transformations


